<body class="page-contact">
  <a class="skip" href="#main">Skip to contact</a>
  <header class="site-header">
    <a class="mark" href="index.html"><img src="assets/logo-hero.svg" width="86" height="64" alt="XI"></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="Open menu"><span></span></button>
    <nav class="site-nav" id="nav">
      <a href="about.html">About</a>
      <a href="events.html">Events</a>
      <a href="services.html">Services</a>
      <a href="sponsorship.html">Sponsorship</a>
      <a class="cta is-here" href="contact.html">Contact</a>
    </nav>
  </header>

  <main id="main">
    <section class="section">
      <form class="form wide" id="contact-form" action="mailto:shaun@xipremierproductions.com" method="post" enctype="text/plain" data-subject="XI contact">
        <div class="field">
          <label for="c-name">Full Name</label>
          <input id="c-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="c-email">Email</label>
          <input id="c-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="c-phone">Cell Phone</label>
          <input id="c-phone" name="phone" type="tel" autocomplete="tel">
        </div>
        <div class="field">
          <label for="c-message">Message</label>
          <textarea id="c-message" name="message" rows="4"></textarea>
        </div>
        <div class="form-actions">
          <button class="cta" type="submit">Send</button>
          <p class="form-note" role="status">We’ll write back.</p>
        </div>
      </form>

      <div class="contact-direct">
        <p><a href="mailto:Shaun@xipremierproductions.com">Shaun@xipremierproductions.com</a></p>
        <p><a href="mailto:info@xipremierproductions.com">info@xipremierproductions.com</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="word" aria-label="XI"><span class="wm-x">X</span><span class="wm-i">I</span></p>
    <div class="foot-row">
      <div>
        <p class="places">New York · Hamptons · Miami</p>
        <p>Private events. Invitation, not tickets.</p>
      </div>
      <p><a href="contact.html">Contact</a></p>
    </div>
  </footer>
  <script src="js/site.js"></script>
</body>
</html>
