<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Profile — XI Members</title>
  <meta name="description" content="Your XI Members profile. Prototype only.">
  <link rel="canonical" href="https://dattax.github.io/members/profile.html">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0A2E32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page page-profile" data-page="profile">
  <a class="skip" href="#main">Skip to profile</a>
  <header class="club-header">
    <a class="brand" href="app.html" aria-label="XI Members"><span class="x">X</span><span class="i">I</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="Open menu"><span></span></button>
    <nav class="club-nav" id="nav">
      <a href="../">XI Premier</a>
      <a href="../about.html">About</a>
      <a href="events.html" data-nav="events">Events</a>
      <a href="../services.html">Services</a>
      <a href="../sponsorship.html">Sponsorship</a>
      <a href="../contact.html">Contact</a>
      <a class="nav-cta" href="app.html" data-nav="members">Members</a>
      <a href="admin.html" data-nav="admin" data-admin hidden>Admin</a>
      <span data-session></span>
    </nav>
  </header>

  <main id="main">
    <header class="page-head">
      <p class="eyebrow">The list</p>
      <h1 class="display">Your<br><em>name.</em></h1>
      <p class="lede">Held on this device only. Role: <span data-role>Member</span>.</p>
    </header>
    <section class="section" style="padding-top:1rem">
      <div class="invite-card" style="margin:0 auto">
        <form class="form" id="profile-form">
          <div class="field">
            <label for="name">Full Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" readonly>
          </div>
          <div class="field">
            <label for="phone">Cell Phone</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel">
          </div>
          <div class="field">
            <label class="check" for="sms">
              <input id="sms" name="sms" type="checkbox">
              <span>Text me about nights (stub — no SMS is sent).</span>
            </label>
          </div>
          <div class="form-actions">
            <button class="cta" type="submit">Save</button>
            <p class="form-note" role="status"></p>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="club-footer">
    <p class="word" aria-label="XI"><span class="wm-x">X</span><span class="wm-i">I</span></p>
    <div class="foot-row">
      <div>
        <p class="places">New York · Hamptons · Miami</p>
        <p>Private events and experiences. Invitation only.</p>
      </div>
      <p><a href="../contact.html">Contact</a></p>
    </div>
  </footer>
  <script src="app.js?v=xi-premier-1"></script>
</body>
</html>
