<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Reset a key — XI Members</title>
  <meta name="description" content="Reset a prototype XI members key. No live mail is sent.">
  <link rel="canonical" href="https://dattax.github.io/members/reset.html">
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <meta name="theme-color" content="#070a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="css/members.css">
</head>
<body data-members="reset">
  <a class="skip" href="#main">Skip to reset</a>
  <header class="site-header">
    <a class="mark" href="../index.html"><img src="assets/logo-hero.svg" width="86" height="64" alt="XI"></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="Open menu"><span></span></button>
    <nav class="site-nav" id="nav">
      <a href="../about.html">About</a>
      <a href="../events.html">Events</a>
      <a href="../services.html">Services</a>
      <a href="../sponsorship.html">Sponsorship</a>
      <a class="cta" href="../contact.html">Contact</a>
      <a class="is-here" href="./">Members</a>
    </nav>
  </header>

  <main id="main" class="members-shell">
    <div class="invite-card">
      <p class="eyebrow">The key</p>
      <h1 class="display">A quieter<br><em>way back in.</em></h1>
      <p class="lede">If the address is on this browser’s list, a new key is kept here. Nothing leaves the house.</p>
      <form class="form" id="reset-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">New key</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-actions">
          <button class="cta" type="submit">Set a new key</button>
          <p class="form-note" role="status"></p>
        </div>
      </form>
      <div class="auth-links">
        <a href="login.html">Sign in</a>
        <a href="request-access.html">Request access</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p class="word" aria-label="XI"><span class="wm-x">X</span><span class="wm-i">I</span></p>
    <div class="foot-row">
      <div>
        <p class="places">New York · Hamptons · Miami</p>
        <p>Private events. Invitation, not tickets.</p>
      </div>
      <p><a href="../contact.html">Contact</a></p>
    </div>
  </footer>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
