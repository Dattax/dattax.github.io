<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Member login — XI Members</title>
  <meta name="description" content="Sign in to the XI Members Club. Prototype only.">
  <link rel="canonical" href="https://dattax.github.io/members/login.html">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0A2E32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-login" data-page="login">
  <a class="skip" href="#main">Skip to sign in</a>
  <a class="house-link" href="../">← XI Premier</a>
  <main id="main" class="auth-shell">
    <div class="invite-card">
      <p class="eyebrow">Members</p>
      <h1 class="display">You’re already<br><em>on the list.</em></h1>
      <p class="lede">Sign in with the address the house holds.</p>
      <form class="form" id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="form-actions">
          <button class="cta" type="submit">Member login</button>
          <p class="form-note" role="status"></p>
        </div>
      </form>
      <div class="auth-links">
        <a href="request-access.html">Request access</a>
        <a href="./">Members</a>
      </div>
    </div>
  </main>
  <script src="app.js?v=xi-premier-1"></script>
</body>
</html>
