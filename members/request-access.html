<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Request access — XI Members</title>
  <meta name="description" content="Ask the XI house to write you onto the members list. Prototype only.">
  <link rel="canonical" href="https://dattax.github.io/members/request-access.html">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0A2E32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-request" data-page="request">
  <a class="skip" href="#main">Skip to request</a>
  <a class="house-link" href="../">← House</a>
  <main id="main" class="auth-shell">
    <div class="invite-card">
      <p class="eyebrow">The house</p>
      <h1 class="display">Ask to be<br><em>written in.</em></h1>
      <p class="lede">Leave a name. Someone who sat will usually be the reason we write back.</p>
      <form class="form" id="request-form">
        <div class="field">
          <label for="name">Full Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="phone">Cell Phone</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel">
        </div>
        <div class="field">
          <label for="note">Anything else you want to tell us</label>
          <textarea id="note" name="note" rows="3"></textarea>
        </div>
        <div class="form-actions">
          <button class="cta" type="submit">Request access</button>
          <p class="form-note" role="status"></p>
        </div>
      </form>
      <div class="auth-links">
        <a href="login.html">Already on the list</a>
        <a href="./">Members</a>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
